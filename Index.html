<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Profile</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#222;font:14px/1.5 Arial,Helvetica,sans-serif}
a{color:#1c5ba8;text-decoration:none}
a:hover{text-decoration:underline}

/* header */
#hdr{background:#17467f}
#hdr .w{max-width:1140px;margin:auto;padding:10px 15px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
#logo{color:#fff;font:700 24px Georgia,serif;letter-spacing:.2px}
#logo:hover{text-decoration:none}
#hdr form{flex:1;min-width:220px;display:flex;max-width:520px}
#hdr input{flex:1;border:1px solid #0f3560;padding:7px 10px;font:inherit}
#hdr button{border:1px solid #0f3560;background:#f0f4fa;padding:0 16px;font:inherit;cursor:pointer}
#menu{margin-left:auto}
#menu a{color:#fff;margin-left:16px;font-size:13px}
#sub{background:#e9eff7;border-bottom:1px solid #c9d6e8}
#sub .w{max-width:1140px;margin:auto;padding:6px 15px;font-size:12px;color:#555}

/* layout */
.w{max-width:1140px;margin:auto}
#page{display:flex;gap:24px;padding:18px 15px 40px;align-items:flex-start}
#main{flex:1;min-width:0}
#side{width:270px;flex:none}

h1{font:700 22px/1.3 Arial,sans-serif;color:#17467f;margin:0 0 8px}
.lead{margin:0 0 18px;color:#444}
h2{font:700 15px Arial,sans-serif;background:#17467f;color:#fff;padding:7px 10px;margin:22px 0 0}
h3{font:700 13px Arial,sans-serif;color:#17467f;margin:0 0 8px;padding-bottom:5px;border-bottom:2px solid #17467f}

table{width:100%;border-collapse:collapse;border:1px solid #cfd8e5}
th,td{padding:7px 10px;text-align:left;vertical-align:top;border:1px solid #dde4ee}
thead th{background:#eaf0f8;color:#17467f;font-weight:700}
tbody tr:nth-child(even){background:#f8fafc}
.kv th{width:32%;background:#f3f6fa;font-weight:700;color:#333}
.kv tr:nth-child(even){background:none}
.ok{color:#18803f;font-weight:700}
.warn{color:#b05a00;font-weight:700}
mark{background:#fff3a8}
.tw{overflow-x:auto}
.note{font-size:12px;color:#666;margin:8px 0 0}

/* sidebar */
.box{border:1px solid #cfd8e5;margin-bottom:18px}
.box h3{background:#eaf0f8;border:0;border-bottom:1px solid #cfd8e5;padding:8px 10px;margin:0}
.box ul{list-style:none;margin:0;padding:0}
.box li{padding:7px 10px;border-bottom:1px solid #eef2f7}
.box li:last-child{border:0}
.box small{display:block;color:#777}

footer{background:#17467f;color:#d6e2f3;font-size:12px}
footer .w{padding:18px 15px}
footer a{color:#fff;margin-right:14px}

@media (max-width:820px){#page{flex-direction:column}#side{width:100%}#menu{margin:0}#menu a{margin:0 14px 0 0}.kv th{width:40%}}
</style>
</head>
<body>

<div id="hdr"><div class="w">
  <a id="logo" href="#"></a>
  <form id="sf" role="search"><input id="q" type="text" placeholder="Search by company name, CIN or director" aria-label="Search"><button type="submit">Search</button></form>
  <div id="menu"><a href="#details">Details</a><a href="#directors">Directors</a><a href="#mines">Mines</a><a href="#contact">Contact</a></div>
</div></div>
<div id="sub"><div class="w" id="crumb"></div></div>

<div class="w" id="page">
  <div id="main">
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <div id="sections"></div>
  </div>
  <aside id="side"></aside>
</div>

<footer><div class="w" id="foot"></div></footer>

<script>
/* ==========================================================
   EDIT YOUR DETAILS HERE. Every line on the page is generated
   from this DATA object. The values below are sample data.
   ========================================================== */
const DATA = {
  siteName: "MineRegistry",
  company: "SAMPLE IRON ORE MINING PRIVATE LIMITED",
  cin: "U13100MP2006PTC000000",
  state: "Madhya Pradesh",
  city: "Jabalpur",
  lead: "SAMPLE IRON ORE MINING PRIVATE LIMITED is a private limited company incorporated on 14 March 2006. It is classified as a non-govt company and is registered at the Registrar of Companies, Gwalior. Its authorised share capital is Rs. 5,00,00,000 and its paid up capital is Rs. 3,20,00,000. It is engaged in the mining of iron ores.",
  updated: "25 November 2026",

  details: [
    ["CIN", "U13100MP2006PTC000000"],
    ["Company Name", "SAMPLE IRON ORE MINING PRIVATE LIMITED"],
    ["Company Status", "Active", "ok"],
    ["RoC", "RoC-Gwalior"],
    ["Registration Number", "000000"],
    ["Company Category", "Company limited by Shares"],
    ["Company Sub Category", "Non-govt company"],
    ["Class of Company", "Private"],
    ["Date of Incorporation", "14 March 2006"],
    ["Age of Company", "20 years, 8 months"],
    ["Activity", "Mining of iron ores"]
  ],
  capital: [
    ["Authorised Capital (Rs)", "5,00,00,000"],
    ["Paid up Capital (Rs)", "3,20,00,000"],
    ["Number of Members (Applicable in case of company without share capital)", "0"]
  ],
  compliance: [
    ["Listing Status", "Unlisted"],
    ["Date of Last AGM", "30 September 2025"],
    ["Date of Balance Sheet", "31 March 2025"]
  ],
  contact: [
    ["Email ID", "info@example.com"],
    ["Website", "www.example.com"],
    ["Phone", "+91 00000 00000"],
    ["Registered Address", "Plot No. 00, Industrial Area, Jabalpur, Madhya Pradesh, 482001, India"]
  ],
  directors: [
    { din: "00000001", name: "RAJESH KUMAR SHARMA", designation: "Managing Director", since: "14 March 2006" },
    { din: "00000002", name: "ANITA SHARMA",        designation: "Director",          since: "01 April 2010" },
    { din: "00000003", name: "VIKRAM SINGH",        designation: "Director",          since: "12 July 2015" }
  ],
  mines: [
    { name: "Kanhwara Iron Ore Mine", location: "Katni, Madhya Pradesh",    area: "48.5 ha", grade: "Fe 62%", lease: "Valid till 2041", status: "Operational" },
    { name: "Bilhari Hematite Block", location: "Jabalpur, Madhya Pradesh", area: "32.0 ha", grade: "Fe 58%", lease: "Valid till 2038", status: "Operational" },
    { name: "Sihora North Block",     location: "Jabalpur, Madhya Pradesh", area: "21.4 ha", grade: "Fe 55%", lease: "Valid till 2045", status: "Under development" }
  ],
  charges: [
    { id: "100000001", holder: "STATE BANK OF INDIA", amount: "2,50,00,000", created: "10 January 2018", status: "Open" },
    { id: "100000002", holder: "HDFC BANK LIMITED",  amount: "1,00,00,000", created: "05 August 2013", status: "Satisfied" }
  ],
  related: [
    { name: "SAMPLE MINERALS PRIVATE LIMITED", note: "Director: Rajesh Kumar Sharma" },
    { name: "SAMPLE LOGISTICS PRIVATE LIMITED", note: "Director: Vikram Singh" }
  ],
  footer: "This is a demonstration website. All figures and names shown are sample data."
};

/* ---------------- rendering: no need to edit below ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kv = rows => `<table class="kv"><tbody>${rows.map(r => `<tr><th>${esc(r[0])}</th><td${r[2] ? ` class="${r[2]}"` : ''}>${esc(r[1])}</td></tr>`).join('')}</tbody></table>`;
const grid = (head, rows) => `<div class="tw"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const sec = (id, title, body, note) => `<section id="${id}"><h2>${title}</h2>${body}${note ? `<p class="note">${note}</p>` : ''}</section>`;
const st = (s, good) => `<span class="${good.includes(s) ? 'ok' : 'warn'}">${esc(s)}</span>`;

document.title = DATA.company + " | " + DATA.siteName;
$('#logo').textContent = DATA.siteName;
$('#crumb').innerHTML = `<a href="#">Home</a> &raquo; <a href="#">${esc(DATA.state)}</a> &raquo; <a href="#">${esc(DATA.city)}</a> &raquo; ${esc(DATA.company)}`;
$('#h1').textContent = DATA.company;
$('#lead').textContent = DATA.lead;
$('#foot').innerHTML = `<p><a href="#">About</a><a href="#">Contact us</a><a href="#">Terms</a><a href="#">Privacy</a></p><p>${esc(DATA.footer)}</p><p>Last updated: ${esc(DATA.updated)}</p>`;

$('#sections').innerHTML = [
  sec('details', 'Company Details', kv(DATA.details)),
  sec('capital', 'Share Capital &amp; Number of Employees', kv(DATA.capital)),
  sec('compliance', 'Listing and Annual Compliance Details', kv(DATA.compliance)),
  sec('contact', 'Contact Details', kv(DATA.contact)),
  sec('directors', 'Director Details', grid(['DIN', 'Director Name', 'Designation', 'Appointment Date'],
    DATA.directors.map(d => `<tr><td>${esc(d.din)}</td><td>${esc(d.name)}</td><td>${esc(d.designation)}</td><td>${esc(d.since)}</td></tr>`))),
  sec('mines', 'Mines and Mining Leases', grid(['Mine', 'Location', 'Area', 'Ore Grade', 'Lease', 'Status'],
    DATA.mines.map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.location)}</td><td>${esc(m.area)}</td><td>${esc(m.grade)}</td><td>${esc(m.lease)}</td><td>${st(m.status, ['Operational'])}</td></tr>`))),
  sec('charges', 'Charges', grid(['Charge ID', 'Charge Holder', 'Amount (Rs)', 'Date of Creation', 'Status'],
    DATA.charges.map(c => `<tr><td>${esc(c.id)}</td><td>${esc(c.holder)}</td><td>${esc(c.amount)}</td><td>${esc(c.created)}</td><td>${st(c.status, ['Satisfied'])}</td></tr>`)))
].join('');

$('#side').innerHTML = `
  <div class="box"><h3>Quick Links</h3><ul>
    <li><a href="#details">Company details</a></li><li><a href="#capital">Share capital</a></li>
    <li><a href="#directors">Directors</a></li><li><a href="#mines">Mines and leases</a></li>
    <li><a href="#charges">Charges</a></li><li><a href="#contact">Contact details</a></li></ul></div>
  <div class="box"><h3>Other Companies of Directors</h3><ul>
    ${DATA.related.map(r => `<li><a href="#">${esc(r.name)}</a><small>${esc(r.note)}</small></li>`).join('')}</ul></div>`;

/* search: highlights matching text on this page and scrolls to the first match */
function search(term) {
  document.querySelectorAll('mark').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  document.body.normalize();
  term = term.trim();
  if (!term) return;
  const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const walker = document.createTreeWalker($('#main'), NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  let first = null;
  nodes.forEach(n => {
    if (!re.test(n.nodeValue)) { re.lastIndex = 0; return; }
    re.lastIndex = 0;
    const span = document.createElement('span');
    span.innerHTML = esc(n.nodeValue).replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&/g,'&amp;'), 'gi'), m => `<mark>${m}</mark>`);
    n.replaceWith(span);
    if (!first) first = span;
  });
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
$('#sf').addEventListener('submit', e => { e.preventDefault(); search($('#q').value); });
</script>
</body>
</html>
